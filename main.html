
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #20252b;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    text-align: center;
    width: 90%;
    max-width: 420px;
}

h1 {
    font-size: 36px;
    margin-bottom: 10px;
    color: #f5c542;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

.scoreboard {
    display: flex;
    justify-content: space-around;
    margin-bottom: 25px;
    background: #303740;
    padding: 15px;
    border-radius: 12px;
}

.score {
    font-size: 20px;
}

.score span {
    display: block;
    font-size: 26px;
    margin-top: 5px;
    color: #f5c542;
}

.status {
    font-size: 20px;
    margin-bottom: 20px;
    color: #fff;
}

.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 25px;
}

.cell {
    aspect-ratio: 1;
    background: #303740;
    border: 2px solid #454e59;
    border-radius: 12px;
    font-size: 55px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

.cell:hover {
    background: #414b57;
}

.cell.x {
    color: #43b9ff;
}

.cell.o {
    color: #f5c542;
}

.cell.winner {
    background: #287c55;
    border-color: #55e69b;
}

button {
    padding: 13px 25px;
    border: none;
    border-radius: 8px;
    background: #f5c542;
    color: #20252b;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ffd968;
}

.reset {
    background: #43b9ff;
}

.reset:hover {
    background: #76ccff;
}

</style>
</head>

<body>

<div class="container">

    <h1>TIC TAC TOE</h1>
    <p class="subtitle">Challenge your friend!</p>

    <div class="scoreboard">
        <div class="score">
            Player X
            <span id="scoreX">0</span>
        </div>

        <div class="score">
            Player O
            <span id="scoreO">0</span>
        </div>
    </div>

    <div class="status" id="status">
        Player X's Turn
    </div>

    <div class="board" id="board">

        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>

        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>

        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>

    </div>

    <button onclick="resetGame()">Restart Game</button>

    <button class="reset" onclick="resetScores()">
        Reset Scores
    </button>

</div>

<script>

const cells = document.querySelectorAll(".cell");
const statusText = document.getElementById("status");

let currentPlayer = "X";
let gameActive = true;

let board = ["", "", "", "", "", "", "", "", ""];

let scoreX = 0;
let scoreO = 0;

const winningConditions = [
    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],
    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],
    [0, 4, 8],
    [2, 4, 6]
];

// Handle player clicks

cells.forEach(cell => {

    cell.addEventListener("click", () => {

        const index = cell.dataset.index;

        if (board[index] !== "" || !gameActive) {
            return;
        }

        board[index] = currentPlayer;

        cell.textContent = currentPlayer;

        cell.classList.add(
            currentPlayer.toLowerCase()
        );

        checkWinner();

    });

});

// Check winner

function checkWinner() {

    let winningPattern = null;

    for (let condition of winningConditions) {

        const [a, b, c] = condition;

        if (
            board[a] !== "" &&
            board[a] === board[b] &&
            board[b] === board[c]
        ) {
            winningPattern = condition;
            break;
        }

    }

    if (winningPattern) {

        statusText.textContent =
            "Player " + currentPlayer + " Wins! 🎉";

        winningPattern.forEach(index => {
            cells[index].classList.add("winner");
        });

        if (currentPlayer === "X") {
            scoreX++;
            document.getElementById("scoreX").textContent = scoreX;
        } else {
            scoreO++;
            document.getElementById("scoreO").textContent = scoreO;
        }

        gameActive = false;
        return;

    }

    // Check draw

    if (!board.includes("")) {

        statusText.textContent = "It's a Draw! 🤝";
        gameActive = false;
        return;

    }

    // Switch player

    currentPlayer = currentPlayer === "X" ? "O" : "X";

    statusText.textContent =
        "Player " + currentPlayer + "'s Turn";

}

// Restart game

function resetGame() {

    board = ["", "", "", "", "", "", "", "", ""];

    currentPlayer = "X";
    gameActive = true;

    cells.forEach(cell => {

        cell.textContent = "";

        cell.classList.remove(
            "x",
            "o",
            "winner"
        );

    });

    statusText.textContent = "Player X's Turn";

}

// Reset scores

function resetScores() {

    scoreX = 0;
    scoreO = 0;

    document.getElementById("scoreX").textContent = 0;
    document.getElementById("scoreO").textContent = 0;

    resetGame();

}

</script>

</body>
</html>
